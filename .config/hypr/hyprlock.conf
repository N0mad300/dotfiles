source = colors.conf

general {
    grace = 1
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/current_wallpaper
    color = rgb(0, 0, 0)
    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3
    brightness = 0.6
    vibrancy = 0.21
    vibrancy_darkness = 0
}

label {
    monitor =
    text = cmd[update:1000] date +'%H'
    color = $on_secondary_container
    font_size = 112
    font_family = Adwaita Sans
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%M'
    color = $on_secondary_container
    font_size = 112
    font_family = Adwaita Sans
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] date +'%A'
    color = $secondary
    font_size = 18
    font_family = JetBrainsMono NFM
    position = 0, -15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] date +'%d %b'
    color = $secondary
    font_size = 14
    font_family = JetBrainsMono NFM
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1
    rounding = 22
    outer_color = $source_color
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $secondary
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, 120
    halign = center
    valign = bottom
}
